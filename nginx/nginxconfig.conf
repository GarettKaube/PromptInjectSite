limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server {
    listen 80;
    server_name <your-static-ip>;

    root /var/www/prompt-injection;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <your-static-ip>;

    root /var/www/prompt-injection;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/<your-static-ip>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<your-static-ip>/privkey.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
       limit_req zone=api_limit burst=5 nodelay;
       limit_req_status 429;
       
       proxy_pass http://<front-end-ip>:3001;
       proxy_http_version 1.1;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_read_timeout 300s;
    }
}