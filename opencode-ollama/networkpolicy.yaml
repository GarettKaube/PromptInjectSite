apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-opencode
spec:
  podSelector:
    matchLabels:
      app: opencode

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - ipBlock:
            cidr: ${BACKEND_IP}/32
      ports:
        - protocol: TCP
          port: 4096

  egress:
    - to:
        - ipBlock:
            cidr: ${OLLAMA_HOST_IP}/32
      ports:
        - protocol: TCP
          port: 11434
